# Framework + model per agent. Each agent runs in its own OS process and connects
# to the same Band room, so they can genuinely be different frameworks AND
# different providers. That cross-provider independence is the point: an
# independent second opinion should not be the same brain — same vendor, same
# weights, same blind spots — as the assessment it is checking.
#
# DEFAULT CAST (as written below) — all-Claude for a reliable demo:
#   Clinical Reviewer        -> Anthropic API    (Claude Sonnet 4.5)   ANTHROPIC_API_KEY
#   Safety Verifier          -> Claude SDK        (Claude Sonnet 4.5)   no key (subscription)
#   Regulatory & Compliance  -> Claude SDK        (Claude Sonnet 4.5)   no key (subscription)
#
# The Safety Verifier is an INDEPENDENT challenger by construction (its own process,
# its own room turn, structurally forbidden from rubber-stamping) regardless of
# provider. To make it cross-provider too — a different framework AND a different set
# of weights/blind spots — flip the one-line toggle in the safety_verifier block below
# (Llama 3.3 70B via LangGraph/Groq). That swap is the cross-provider story; the
# all-Claude default is the reliable-recording story.
#
# Any key beyond framework/model/provider/base_url/api_key_env/fallback is
# forwarded straight to the adapter/LLM (temperature, streaming, max_tokens, ...).
#
# ── Flip any agent to something you already have (one-line swaps) ──────────
#   # Claude subscription (no API key):   framework: claude_sdk
#   #                                     model: claude-sonnet-4-5
#   # Featherless (hackathon promo BOA26): provider: openai
#   #                                      model: Qwen/Qwen2.5-72B-Instruct
#   #                                      base_url: https://api.featherless.ai/v1
#   #                                      api_key_env: FEATHERLESS_API_KEY
#   # AI/ML API (hackathon partner):       provider: openai
#   #                                      model: gpt-4o-mini
#   #                                      base_url: https://api.aimlapi.com/v1
#   #                                      api_key_env: AIMLAPI_KEY
#   # Local model (Ollama/vLLM):           provider: openai
#   #                                      model: llama3.1:8b
#   #                                      base_url: http://localhost:11434/v1

clinical_reviewer:
  framework: anthropic
  model: claude-sonnet-4-5

# DEFAULT (production / recording): all-Claude for reliability. The Safety Verifier
# is still a genuinely INDEPENDENT challenger (separate process, separate room turn,
# structurally forbidden from rubber-stamping) — it just runs the same provider here
# so a public demo cannot stall. Cross-provider independence is one swap away below.
safety_verifier:
  framework: claude_sdk
  model: claude-sonnet-4-5

# CROSS-PROVIDER TOGGLE (one-line swap): comment the block above and uncomment this
# to run the challenger on a different framework AND provider — Llama 3.3 70B via
# LangGraph/Groq — so it shares none of the lead's weights or blind spots. Auto-falls
# back to claude_sdk if GROQ_API_KEY is unset.
# WARNING: the Groq free tier rate-limits multi-turn board runs (429 on the larger
# re-verify turn). Use it for a short recorded take, not a live public demo.
# safety_verifier:
#   framework: langgraph
#   provider: openai
#   model: llama-3.3-70b-versatile
#   base_url: https://api.groq.com/openai/v1
#   api_key_env: GROQ_API_KEY
#   streaming: false
#   temperature: 0
#   fallback:
#     framework: claude_sdk
#     model: claude-sonnet-4-5

# Compliance gate on the Claude SDK (subscription, no API key) for strict turn
# discipline — this is the relay's coordinator and benefits from reliability.
regulatory_compliance:
  framework: claude_sdk
  model: claude-sonnet-4-5
